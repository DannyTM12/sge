services:
  db:
    image: postgres:16-alpine
    container_name: sge_db
    environment:
      POSTGRES_USER: sge_user
      POSTGRES_PASSWORD: sge_pass
      POSTGRES_DB: sge_db
    volumes:
      - sge_postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sge_user -d sge_db"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: sge_redis
    volumes:
      - sge_redis_data:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: sge_api
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+asyncpg://sge_user:sge_pass@db:5432/sge_db
      REDIS_URL: redis://redis:6379/0
    volumes:
      - ./app:/app/app
      - ./alembic:/app/alembic
      - ./alembic.ini:/app/alembic.ini
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    restart: unless-stopped

  frontend:
    image: node:22-alpine
    container_name: sge_frontend
    working_dir: /app
    volumes:
      - ./frontend:/app
    ports:
      - "5173:5173"
    command: sh -c "npm install && npm run dev -- --host"
    depends_on:
      - api
    restart: unless-stopped

volumes:
  sge_postgres_data:
  sge_redis_data:
